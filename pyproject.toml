[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-math-artifact-audit"
version = "0.1.0"
description = "Reproducible public-artifact analysis of the 2026 OpenAI mathematics release"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "pypdf>=4.0", "scipy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
